name: Bug 报告
description: 报告可以稳定复现的功能或工程问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要在这里公开，请改用 SECURITY.md 中的私密报告方式。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 简明说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定、已脱敏的复现步骤。
      placeholder: |
        1. 使用配置……启动
        2. 调用……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 提交或版本
      placeholder: 例如 d57c5e5
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、JDK、Docker、浏览器及相关配置。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 不要粘贴密码、JWT、Cookie、密钥、证书或个人数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到重复问题。
          required: true
        - label: 我已删除凭据、Token 和个人数据。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
