server:
  port: 8080

# No default profile on purpose: startup fails fast without an explicit
# SPRING_PROFILES_ACTIVE (dev locally, prod in production) instead of
# silently running on development credentials.
spring:
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${dinehub.datasource.driver-class-name}
      url: jdbc:mysql://${dinehub.datasource.host}:${dinehub.datasource.port}/${dinehub.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${dinehub.datasource.username}
      password: ${dinehub.datasource.password}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  redis:
    host: ${dinehub.redis.host}
    port: ${dinehub.redis.port}
    password: ${dinehub.redis.password}
    database: ${dinehub.redis.database}
  rabbitmq:
    host: ${DINEHUB_MQ_HOST:localhost}
    port: ${DINEHUB_MQ_PORT:5672}
    username: ${DINEHUB_MQ_USERNAME:dinehub}
    password: ${DINEHUB_MQ_PASSWORD:dinehub}
    listener:
      simple:
        # benchmark showed a single consumer drains ~85 msg/s (fsync-bound);
        # a small pool keeps the async backlog short without hammering the DB
        concurrency: 4
        max-concurrency: 8
        # after retries are exhausted the message is rejected into the DLX
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dinehub.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      dinehub:
        # switch mapper to debug locally to inspect SQL; keep info by default
        # because per-request logging noticeably distorts throughput numbers
        mapper: ${DINEHUB_LOG_MAPPER:info}
        service: info
        controller: info

dinehub:
  jwt:
    # secret keys for signing JWT tokens; override via env vars outside local dev
    admin-secret-key: ${DINEHUB_JWT_ADMIN_SECRET:dinehub-admin-dev-secret}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${DINEHUB_JWT_USER_SECRET:dinehub-user-dev-secret}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${dinehub.alioss.endpoint}
    access-key-id: ${dinehub.alioss.access-key-id}
    access-key-secret: ${dinehub.alioss.access-key-secret}
    bucket-name: ${dinehub.alioss.bucket-name}
  wechat:
    appid: ${dinehub.wechat.appid}
    secret: ${dinehub.wechat.secret}
    mchid: ${dinehub.wechat.mchid}
    mchSerialNo: ${dinehub.wechat.mchSerialNo}
    privateKeyFilePath: ${dinehub.wechat.privateKeyFilePath}
    apiV3Key: ${dinehub.wechat.apiV3Key}
    weChatPayCertFilePath: ${dinehub.wechat.weChatPayCertFilePath}
    notifyUrl: ${dinehub.wechat.notifyUrl}
    refundNotifyUrl: ${dinehub.wechat.refundNotifyUrl}
  cache:
    # dish list cache toggle; disable only for benchmarking the DB baseline
    dish-enabled: ${DINEHUB_CACHE_DISH_ENABLED:true}
    double-delete-delay-millis: ${DINEHUB_CACHE_DOUBLE_DELETE_DELAY:500}
  rate-limit:
    enabled: ${DINEHUB_RATE_LIMIT_ENABLED:true}
  order:
    # mq = delayed message cancellation with low-frequency scan fallback (default)
    # task = polling-only cancellation kept as the comparison baseline
    cancel-mode: ${DINEHUB_ORDER_CANCEL_MODE:mq}
    # payment timeout; also the delay queue TTL — changing it requires deleting order.delay.queue
    pay-timeout-millis: ${DINEHUB_ORDER_PAY_TIMEOUT_MILLIS:900000}
    timeout-scan-cron: ${DINEHUB_ORDER_TIMEOUT_SCAN_CRON:0 0/10 * * * ?}
  demo-login:
    # nickname-based login for demo environments only; the dev profile turns
    # it on explicitly, every other profile keeps it off
    enabled: ${DINEHUB_DEMO_LOGIN:false}
  seckill:
    # redis = Redis+Lua+MQ async persistence (default); db = row-lock deduction (benchmark baseline)
    mode: ${DINEHUB_SECKILL_MODE:redis}
  scan-order:
    # URL encoded into each table's QR code; points at the dine-in H5 entry
    h5-base-url: ${DINEHUB_H5_BASE_URL:http://localhost:8080/h5/index.html}
  shop:
    address: 南京市玄武区中山路100号
  baidu:
    ak: ${DINEHUB_BAIDU_AK:your-ak}
