name: 功能建议
description: 提议与当前项目边界匹配的功能或工程改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先描述用户或工程问题，不要只列技术名词。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明主要流程、数据变化和边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括“不实现”或使用现有能力的选择。
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 成本与风险
      description: 说明复杂度、兼容性、测试、部署和运维成本。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要影响区域
      options:
        - 后端业务
        - 前端体验
        - 数据库
        - Redis / RabbitMQ
        - Docker / CI
        - 文档
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认现有功能不能直接解决这个问题。
          required: true
        - label: 该建议不是单纯为了增加技术栈。
          required: true
